name: TravelDrop
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^0.13.6
  path_provider: ^2.0.15
  dio: ^5.7.0
  photo_view: ^0.15.0

  # Firebase
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.4
  firebase_core: ^3.6.0
  firebase_storage: ^12.4.10

  image_picker: ^1.1.2
  intl: ^0.19.0
  dropdown_search: ^6.0.3
  flutter_typeahead: ^5.0.0
  qr_flutter: ^4.1.0
  cached_network_image: ^3.3.0

  # Google Maps & Places
  google_place: ^0.4.7
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.6




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21
